name: Monitor legal Aferium

on:
  schedule:
    # 06:17 e 18:17 em Maceió (UTC-3). Precisa bater com SCAN_TIMES_UTC em scripts/scan.mjs.
    - cron: '17 9,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legal-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Diagnóstico de rede (ADEAL e Saúde)
        continue-on-error: true
        run: |
          for u in https://www.defesaagropecuaria.al.gov.br/ https://bvsms.saude.gov.br/; do
            echo "== $u"; curl -4 -sS -o /dev/null -m 90 -A "Mozilla/5.0" -w "IPv4 http=%{http_code} conectou=%{time_connect}s total=%{time_total}s\n" "$u" || echo "IPv4 falhou"
            curl -6 -sS -o /dev/null -m 30 -A "Mozilla/5.0" -w "IPv6 http=%{http_code} total=%{time_total}s\n" "$u" || echo "IPv6 falhou"
          done
      - name: Varrer as fontes oficiais
        run: node scripts/scan.mjs
      - name: Publicar o resultado
        run: |
          git config user.name "aferium-legal-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add public/legal
          if git diff --cached --quiet; then echo "Sem mudanças para publicar."; else git commit -m "Varredura legal $(date -u +%Y-%m-%dT%H:%MZ)"; git push; fi
